# Bygger Planwright til Mac og Windows på GitHubs egne maskiner.
# Kører af sig selv, når der skubbes til main (fx en ny Planwright-Mac-Kit.zip),
# og kan også startes manuelt under Actions -> Byg Planwright -> Run workflow.
# Resultatet lægges under Releases -> "Planwright":
#   Planwright.dmg        Mac (Apple Silicon + Intel)
#   Planwright-Setup.exe  Windows-installer
#   Planwright.exe        Windows, kør direkte uden installation
name: Byg Planwright

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pak kittet ud
        run: unzip -q Planwright-Mac-Kit.zip -d kit

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Test
        working-directory: kit/Planwright
        run: cargo test

      - name: Byg Planwright.app og Planwright.dmg
        working-directory: kit/Planwright
        run: sh packaging/macos/build-mac-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Planwright-mac
          path: kit/Planwright/dist/macos/Planwright.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pak kittet ud
        shell: bash
        run: unzip -q Planwright-Mac-Kit.zip -d kit

      - uses: dtolnay/rust-toolchain@stable

      - name: Byg Planwright.exe
        working-directory: kit/Planwright
        run: cargo build --release

      - name: Byg installer (Inno Setup)
        shell: pwsh
        run: |
          $v = (Select-String -Path kit/Planwright/Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DSourceExe=${{ github.workspace }}\kit\Planwright\target\release\planwright.exe" "/O${{ github.workspace }}\dist" packaging-windows\Planwright.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item kit\Planwright\target\release\planwright.exe dist\Planwright.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Planwright-windows
          path: |
            dist/Planwright-Setup.exe
            dist/Planwright.exe

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Læg filerne ud som release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create latest dist/Planwright.dmg dist/Planwright-Setup.exe dist/Planwright.exe \
            --repo "$REPO" \
            --target "${{ github.sha }}" \
            --title "Planwright" \
            --notes "Mac: hent Planwright.dmg, åbn den og træk Planwright.app over i Programmer. Første gang: højreklik på appen, vælg Åbn og bekræft. Kører på Apple Silicon og Intel, macOS 11 eller nyere.

          Windows: hent Planwright-Setup.exe og kør den (installerer i Programmer, laver genvej i Start-menuen og åbner .plan-filer). Vil du hellere køre uden installation, så hent Planwright.exe. Viser Windows 'Windows har beskyttet din pc', så klik 'Flere oplysninger' og 'Kør alligevel'."
